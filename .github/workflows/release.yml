name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Project
        shell: powershell
        run: |
          .\build.ps1 -Mode all

      - name: Package Dist
        shell: powershell
        run: |
          Compress-Archive -Path dist\* -DestinationPath Antigravity-No-TUN-Launcher.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Antigravity-No-TUN-Launcher.zip
            dist/AntigravityLauncher.exe
          draft: false
          prerelease: false
          generate_release_notes: true
